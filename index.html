<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIDI → Bytebeat Studio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--tx:#1b1d22;--mu:#6b7280;--ac:#0a7d3c;--bd:#d5d8de;--code:#0d1117;--cx:#7ee787}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#171a20;--tx:#e6e8ec;--mu:#8b93a1;--ac:#3ddc84;--bd:#2a2f38}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#171a20;--tx:#e6e8ec;--mu:#8b93a1;--ac:#3ddc84;--bd:#2a2f38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 4px}h1 span{color:var(--ac)}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:4px}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--ac)}
button{cursor:pointer;font-weight:600}button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.p:hover:not(:disabled){color:#fff;opacity:.88}
button:disabled{opacity:.4;cursor:not-allowed}
.tr{display:grid;grid-template-columns:24px 1fr 210px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.tr small{color:var(--mu)}
@media(max-width:600px){.tr{grid-template-columns:24px 1fr}.tr select{grid-column:1/-1}}
#bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:8px}#bar i{display:block;height:100%;width:0;background:var(--ac)}
textarea{width:100%;height:240px;box-sizing:border-box;background:var(--code);color:var(--cx);font:11px/1.3 ui-monospace,Consolas,monospace}
#log{color:var(--mu);font-size:13px;margin-top:8px;word-break:break-word}
details{color:var(--mu);font-size:13px}code{background:var(--bg);padding:1px 5px;border-radius:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chk{flex-direction:row;align-items:center;gap:6px}
.tr input[type=range]{padding:0;accent-color:var(--ac)}
@media(min-width:601px){.tr{grid-template-columns:24px 1fr 190px 120px}}
@media(max-width:600px){.tr input[type=range]{grid-column:1/-1}}
body.drag main{outline:2px dashed var(--ac);outline-offset:-6px}
</style>
</head>

<main>
<header class="top"><h1>MIDI → <span>Bytebeat</span> Studio</h1><div><button id="lang">EN</button> <button id="theme" title="Theme">◐</button></div></header>
<p class="sub" data-i="sub"></p>
<div class="card">
  <div class="row">
    <label><span data-i="file"></span><input type="file" id="file" accept=".mid,.midi,.json,application/json,audio/midi"></label>
    <label><span data-i="sr"></span><select id="sr"><option>8000</option><option>11025</option><option selected>22050</option><option>32000</option><option>44100</option></select></label>
    <label><span data-i="mode"></span><select id="mode"><option value="b" data-i="modeB"></option><option value="f" data-i="modeF"></option></select></label>
    <label><span data-i="max"></span><input id="max" type="number" min="0" value="0" style="width:110px"></label>
    <label><span data-i="gain"></span><input id="gain" type="number" step="0.05" min="0.05" value="0.4" style="width:80px"></label>
    <label><span data-i="speed"></span><input id="speed" type="number" step="0.05" min="0.25" max="4" value="1" style="width:80px"></label>
    <label><span data-i="trans"></span><input id="trans" type="number" step="1" min="-48" max="48" value="0" style="width:80px"></label>
    <label class="chk"><input type="checkbox" id="std" checked><span data-i="std"></span></label>
  </div>
  <p class="sub" style="margin:10px 0 0" data-i="drop"></p>
  <details style="margin-top:8px"><summary data-i="supS"></summary><p data-i="sup"></p></details>
</div>
<div class="card" id="tcard" hidden>
  <b data-i="tracks"></b> <small style="color:var(--mu)" data-i="tracksH"></small>
  <div id="tracks"></div>
</div>
<div class="card">
  <button class="p" id="conv" disabled data-i="conv"></button>
  <button id="play" disabled data-i="play"></button>
  <button id="stop" disabled data-i="stop"></button>
  <button id="copy" disabled data-i="copy"></button>
  <button id="dl" disabled data-i="dl"></button>
  <div id="bar"><i></i></div>
  <div id="log"></div>
</div>
<textarea id="code" readonly></textarea>
</main>

let lang;try{lang=localStorage.getItem('lang');}catch(e){}
if(!L[lang])lang=/^ru/i.test(navigator.language||'')?'ru':'en';
const I=(k,...a)=>{let s=L[lang][k];a.forEach((x,i)=>s=s.replace('{'+i+'}',x));return s;};
let cur=['wait',[]];
function renderTracks(){
 const old=tracks.map((t,i)=>$('on'+i)?[$('on'+i).checked,$('v'+i).value,$('g'+i).value]:null);
 $('tracks').innerHTML=tracks.map((t,i)=>{const o=old[i]||[true,t.voice,100];
  return `<div class="tr"><input type="checkbox" id="on${i}"${o[0]?' checked':''}><div>${i+1}. ${t.name.replace(/&/g,'&amp;').replace(/</g,'&lt;')} <small>· ${I('chan')} ${t.ch+1}${t.prog>=0?' · '+I('prog')+' '+t.prog:''} · ${t.notes.length} ${I('notesN')}</small></div><select id="v${i}">${VN().map((n,k)=>`<option value="${k}"${k==o[1]?' selected':''}>${n}</option>`).join('')}</select><input type="range" id="g${i}" min="0" max="150" value="${o[2]}" title="${I('vol')}"></div>`;}).join('');}
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=I(e.dataset.i));
 $('code').placeholder=I('ph');$('lang').textContent=lang==='ru'?'EN':'RU';
 if($('tracks').children.length)renderTracks();
 $('log').textContent=I(cur[0],...cur[1]);}

let tracks=[],last=null,ctx=null,src=null,token=0,lastFile=null;
const log=(k,...a)=>{cur=[k,a];$('log').textContent=I(k,...a);};

$('file').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  lastFile=f;tracks=await load(f);
  if(!tracks.length)throw new Error(I('noTracks'));
  $('tracks').innerHTML='';renderTracks();
  $('tcard').hidden=false;$('conv').disabled=false;
  log('loaded',f.name,tracks.length,tracks.reduce((a,t)=>a+t.notes.length,0));
 }catch(err){log('err',err.message);}
};

function build(){
 const sp=+$('speed').value||1,tp=+$('trans').value||0,SR=+$('sr').value,FL=$('mode').value==='f',G=+$('gain').value||.4,mx=+$('max').value||1e9;
 const all=[];
 tracks.forEach((t,i)=>{if(!$('on'+i).checked)return;const w=+$('v'+i).value,gv=$('g'+i).value/100;for(const n of t.notes){const tt=n.t/sp;if(tt<mx)all.push([tt,n.d/sp,w===128?n.m:Math.max(0,Math.min(127,n.m+tp)),Math.min(1.5,n.v*gv),w,n.b]);}});
 if(!all.length)throw new Error(I('noNotes'));
 all.sort((a,b)=>a[0]-b[0]);
 let prev=0,end=0;const enc=[];
 for(const n of all){
  const t=Math.round(n[0]*1000),d=Math.max(1,Math.round(Math.min(n[1],30,mx-n[0]+1)*1000));
  enc.push((t-prev).toString(36),d.toString(36),n[2].toString(36),Math.max(1,Math.min(127,Math.round(n[3]*127))).toString(36),n[4].toString(36));
  prev=t;end=Math.max(end,n[0]+Math.min(n[1],30));}
 const D=enc.join(','),BS=all.map((n,i)=>n[5]&&n[4]<128?[i.toString(36)].concat(...n[5].map(c=>[Math.round(c[0]/sp*1000).toString(36),Math.max(0,Math.min(4800,Math.round(c[1]*100+2400))).toString(36)])).join(','):null).filter(Boolean).join(';');
 const used=new Set(all.map(n=>n[4])),vt=JSON.stringify(VT.map((v,i)=>used.has(i)?v:null)).replace(/"([a-z]+)":/g,'$1:'),dr=JSON.stringify(DR);
 const key='_bb'+Date.now().toString(36).slice(-4);
 const body=RT.toString().replace(/\n\s*/g,'');
 const code=`(window.${key}=window.${key}||(${body})("${D}",${SR},${vt},${dr},${G},${FL},"${BS}"),window.${key}(t))`;
 return{code,SR,FL,fn:RT(D,SR,VT,DR,G,FL,BS),len:Math.min(end,mx)+1.5,n:all.length};}

$('conv').onclick=()=>{
 try{
  last=build();$('code').value=last.code;
  ['play','copy','dl'].forEach(k=>$(k).disabled=false);
  log('ready',last.n,(last.code.length/1024).toFixed(1),last.len.toFixed(0),last.SR,last.FL?'Floatbeat':'Bytebeat');
 }catch(err){log('err',err.message);console.error(err);}
};
$('std').onchange=()=>{if(lastFile)$('file').onchange({target:{files:[lastFile]}});};
$('copy').onclick=()=>{$('code').select();document.execCommand('copy');log('copied');};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([last.code],{type:'text/javascript'}));a.download='bytebeat.js';a.click();};
function halt(){token++;try{src&&src.stop();}catch(_){}src=null;$('bar').firstChild.style.width='0';}
$('stop').onclick=()=>{halt();$('stop').disabled=true;log('stopped');};
$('play').onclick=async()=>{
 halt();const my=token,{fn,SR,FL,len}=last,N=Math.ceil(len*SR);
 ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();
 const buf=ctx.createBuffer(1,N,SR),ch=buf.getChannelData(0);$('stop').disabled=false;
 for(let i=0;i<N;){
  const e=Math.min(N,i+15000);
  for(;i<e;i++){const v=fn(i);ch[i]=FL?v:v/127.5-1;}
  $('bar').firstChild.style.width=(i/N*100)+'%';log('render',i/N*100|0);
  await new Promise(r=>setTimeout(r));if(my!==token)return;}
 src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start();
 src.onended=()=>{if(my===token)log('ended');};
 log('playing',len.toFixed(0));};

$('lang').onclick=()=>{lang=lang==='ru'?'en':'ru';try{localStorage.setItem('lang',lang);}catch(e){}applyLang();};
$('theme').onclick=()=>{const d=document.documentElement,c0=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),n=c0==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('theme',n);}catch(e){}};
try{const th=localStorage.getItem('theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
document.addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag');});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag');});
document.addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');if(e.dataTransfer.files.length)$('file').onchange({target:{files:e.dataTransfer.files}});});
applyLang();
</script>
